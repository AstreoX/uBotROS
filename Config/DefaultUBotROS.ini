; Redirects from the legacy AgentSensorROSBridge plugin (TempoROS based) to UBotROS.
;
; This file is the single list of these redirects. The plugin manager loads it into the "UBotROS"
; config branch while configuring enabled plugins (layer {PLUGIN}/Config/Default{TYPE}.ini) and
; InitUObject reads [CoreRedirects] from every GConfig file, so it is active before any asset loads.
; The test UBotROS.Redirects.Resolve checks the entries below.
;
; The vehicle / drone command components (AgentVehicleROSBridge, AgentDroneROSBridge) are deliberately
; not redirected: UUBotROSVelocityCommandComponent has a different API and is added by hand.

[CoreRedirects]

; Module rename. The specific class/struct/enum/object redirects below win over this one (higher match
; score). It covers imports of the script package itself (member parents of delegate pins) and the
; Default__ object of the redirected component class.
+PackageRedirects=(OldName="/Script/AgentSensorROSBridge",NewName="/Script/UBotROS")

; The suite publisher component became the uBot ROS Sensor Bridge.
+ClassRedirects=(OldName="/Script/AgentSensorROSBridge.AgentROSSensorSuitePublisherComponent",NewName="/Script/UBotROS.UBotROSSensorBridgeComponent")

; Renamed properties. Property redirects are looked up with the struct the data is loaded into (the new
; class), so OldName names the new class. Unchanged names need no entry: bAutoInitialize,
; bPublishInvalidSamples, bPublishDynamicTF, bPublishStaticSensorTF, OdometryFrame, BaseLinkComponent,
; TopicOverrides, and SensorDataQOSOverride / StateQOSOverride (FName comparison is case-insensitive, so
; they load into SensorDataQosOverride / StateQosOverride as they are). NodeNameOverride has no successor
; (there is no ROS node per component any more) and is dropped.
+PropertyRedirects=(OldName="/Script/UBotROS.UBotROSSensorBridgeComponent.RobotNamespace",NewName="/Script/UBotROS.UBotROSSensorBridgeComponent.RobotNamespaceOverride")
+PropertyRedirects=(OldName="/Script/UBotROS.UBotROSSensorBridgeComponent.BaseLinkFrame",NewName="/Script/UBotROS.UBotROSSensorBridgeComponent.BaseFrameOverride")

; Structs kept under new names. FAgentROSTopicOverride has the same fields (bOverride, Topic).
; FAgentROSQOSOverride {bOverride, Reliability, QueueSize} became FUBotROSQosOverride {bOverride, Qos}.
; bOverride is kept. A redirect cannot move a value into the nested Qos struct, so the legacy values load
; into two load-only members (Reliability_DEPRECATED, QueueSize_DEPRECATED) and
; FUBotROSQosOverride::PostSerialize moves them into Qos (with a Warning that the asset should be re-saved).
; UHT reflects those members under the names Reliability and QueueSize (the _DEPRECATED suffix is stripped and
; the property is flagged deprecated), so the legacy property tags match them by name and no property
; redirect is needed - adding one would point the tags at a name that does not exist.
+StructRedirects=(OldName="/Script/AgentSensorROSBridge.AgentROSTopicOverride",NewName="/Script/UBotROS.UBotROSTopicOverride")
+StructRedirects=(OldName="/Script/AgentSensorROSBridge.AgentROSQOSOverride",NewName="/Script/UBotROS.UBotROSQosOverride")

; Enums kept under new names (value names are unchanged; UEnum re-qualifies "EOld::Value" with the new enum name).
+EnumRedirects=(OldName="/Script/AgentSensorROSBridge.EAgentROSBridgeStatus",NewName="/Script/UBotROS.EUBotROSSensorBridgeStatus")
+EnumRedirects=(OldName="/Script/AgentSensorROSBridge.EAgentROSReliability",NewName="/Script/UBotROS.EUBotROSReliability")

; Dynamic delegate signatures of the component events (UDelegateFunction objects whose outer is the
; script package; the linker resolves them with Type_Object, so ObjectRedirects are needed).
+ObjectRedirects=(OldName="/Script/AgentSensorROSBridge.AgentROSBridgeReadyEvent__DelegateSignature",NewName="/Script/UBotROS.UBotROSSensorBridgeReadyEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorROSBridge.AgentROSBridgeErrorEvent__DelegateSignature",NewName="/Script/UBotROS.UBotROSSensorBridgeErrorEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorROSBridge.AgentROSPublishersRefreshedEvent__DelegateSignature",NewName="/Script/UBotROS.UBotROSPublishersRefreshedEvent__DelegateSignature")
